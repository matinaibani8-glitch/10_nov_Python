<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="/static/imgs/applogo.png">
</head>

<body>
    {% for msg in messages %}
    <!-- {{msg}} -->
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>{{msg}}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    <nav class="navbar navbar-expand-lg bg-body-dark">
        <div class="container-fluid">
            <!-- <a class="navbar-brand" href="#">Navbar</a> -->
            <a class="navbar-brand" href="#">
                <img src="/static/imgs/applogo.png" alt="Bootstrap" width="30" height="24">
                NotesApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Notes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Profile</a>
                    </li>
                </ul>
            </div>
            {% if cuser is none %}
            <button type="button" class="btn btn-outline-primary">Signin</button>
            <button type="button" class="btn btn-outline-warning mx-2">Signup</button>
            {% else %}
            <!-- <button type="button" class="btn btn-outline-danger ">Logout</button>
            <a class="btn btn-outline-danger"  href="/userlogout">Logout</a>  -->
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    {{cuser}}
                </button>
                <ul class="dropdown-menu">
                    <!-- <li><a class="dropdown-item" href="/profile">Update Profile</a></li> -->
                    <li><a class="dropdown-item" href="/userlogout">Logout</a></li>
                </ul>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container my-5">
        <form method="post">
            {% csrf_token %}
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>First name</label>
                    <input type="text" value="{{uid.firstname}}" class="form-control" name="firstname">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Last name</label>
                    <input type="text" value="{{uid.lastname}}" class="form-control" name="lastname">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Username</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="email" value="{{uid.username}}" class="form-control" name="username">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Password</label>
                    <input type="password" value="{{uid.password}}" class="form-control" name="password">
                </div>

                <div class="col-md-6 mb-3">
                    <label>City</label>
                    <input type="text" value="{{uid.city}}" class="form-control" name="city">
                </div>

                <div class="col-md-3 mb-3">
                    <label>State</label>
                    <select class="form-select" name="state">
                        <option>{{uid.state}}</option>
                        <option>Gujarat</option>
                        <option>Maharashtra</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Mobile</label>
                    <input type="text" value="{{uid.mobil}}" class="form-control" name="mobil">
                </div>

                <div class="col-12 mb-3">
                    <input type="checkbox">
                    Agree to terms and conditions
                </div>

            </div>

            <button class="btn btn-primary">
                Update Profile
            </button>

        </form>
    </div>
</body>

</html>
